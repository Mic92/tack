# Role in tekton-pipelines so tack can manage PipelineRuns and read pod logs there.
# The RoleBinding references tack's ServiceAccount cross-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tack
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tack
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tack
    namespace: tack
roleRef:
  kind: Role
  name: tack
  apiGroup: rbac.authorization.k8s.io
