apiVersion: apps/v1
kind: Deployment
metadata:
  name: tack
  namespace: tack
spec:
  replicas: 1  # SQLite is single-writer; do not scale above 1
  selector:
    matchLabels:
      app: tack
  template:
    metadata:
      labels:
        app: tack
    spec:
      serviceAccountName: tack
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tack
          image: atcr.io/dsx.sh/tack:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TACK_LISTEN_ADDR
              value: ":8080"
            - name: TACK_DB_PATH
              value: "/var/lib/tack/tack.db"
            - name: TACK_TEKTON_ENABLED
              value: "1"
            - name: TACK_TEKTON_NAMESPACE
              value: "tekton-pipelines"
          envFrom:
            - secretRef:
                name: tack
          volumeMounts:
            - name: db
              mountPath: /var/lib/tack
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: tack-db
